<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>Gym Evolution - المساعد الرياضي المتكامل والتغذية الذكية</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="منصة Gym Evolution المتقدمة لمتابعة اللياقة البدنية، تتبع السعرات التغذوية والماكروز، تخطيط الجلسات الرياضية ورصد التطور البدني بيانيّاً بأسلوب Calm White العصري.">
    <meta name="keywords" content="حساب السعرات, BMR, TDEE, جدول تمارين, تتبع الوزن, Gym Evolution, ماكروز, لياقة بدنية">
    <meta name="author" content="Gym Evolution Team">
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111118">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gym Evolution">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='38' fill='%23111118'/><text x='96' y='125' font-size='82' font-family='sans-serif' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'>GE</text></svg>">
    
    <!-- Google Identity Services (GSI) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Mobile Top Header Bar -->
    <header class="mobile-top-header">
        <div class="logo-container" style="margin-bottom: 0;">
            <div class="logo-icon">GE</div>
            <span class="logo-text">Gym Evolution</span>
        </div>
        <div class="mobile-header-actions">
            <!-- Quick Unit Switcher (kg / lb) -->
            <button class="unit-switch-pill" id="mobile-unit-btn" title="تبديل وحدة القياس (كجم / باوند)">
                <span class="unit-active" id="mobile-unit-label">كجم / سم</span>
            </button>

            <!-- PWA Install Button Mobile -->
            <button class="btn-icon pwa-install-btn" id="mobile-pwa-install-btn" title="تثبيت التطبيق على جهازك للعمل أوفلاين" style="display: none; color: var(--accent-blue);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </button>

            <button class="btn-icon mobile-notif-btn" id="mobile-reminders-btn" title="التنبيهات والتذكيرات">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <span class="notif-pulse-dot" id="mobile-notif-dot"></span>
            </button>
            <div class="profile-avatar mobile-avatar" id="mobile-user-avatar">GM</div>
        </div>
    </header>

    <!-- Main App Container Shell -->
    <div id="app-container">
        
        <!-- Sidebar Navigation Drawer (Desktop & Tablet) -->
        <aside id="desktop-sidebar">
            <div>
                <!-- Brand logo area -->
                <div class="logo-container">
                    <div class="logo-icon">GE</div>
                    <div>
                        <span class="logo-text">Gym Evolution</span>
                        <span class="logo-version">v1.2</span>
                    </div>
                </div>

                <!-- Navigation link list -->
                <nav>
                    <a href="#" class="nav-item active" id="nav-dashboard">
                        <!-- Dashboard icon (SVG) -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>
                        <span>لوحة التحكم</span>
                    </a>
                    
                    <a href="#" class="nav-item" id="nav-nutrition">
                        <!-- Apple/Food icon (SVG) -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2v3M12 5a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM8 9a1 1 0 1 1 2 0v2a1 1 0 1 1-2 0V9zM14 9a1 1 0 1 1 2 0v2a1 1 0 1 1-2 0V9z"></path></svg>
                        <span>محرك السعرات</span>
                    </a>
                    
                    <a href="#" class="nav-item" id="nav-workout">
                        <!-- Dumbbell/Dumbbell icon (SVG) -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6.5 6.5h11M6.5 17.5h11M18 5v14M6 5v14M3 8v8M21 8v8M12 5v14"></path></svg>
                        <span>مخطط التمارين</span>
                    </a>
                    
                    <a href="#" class="nav-item" id="nav-evolution">
                        <!-- Trend up chart icon (SVG) -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
                        <span>تتبع التطور</span>
                    </a>

                    <a href="#" class="nav-item" id="nav-assistant">
                        <!-- Bot / Message icon (SVG) -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        <span>مساعد البطل 🦾</span>
                    </a>
                </nav>
            </div>

            <!-- Profile & Google Sign-In Widget at bottom -->
            <div>
                <div style="display: flex; gap: 0.5rem; margin-bottom: 0.75rem;">
                    <button class="sidebar-reminder-btn" id="sidebar-reminders-btn" title="إعدادات التذكيرات" style="margin-bottom: 0; flex: 1;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                        <span>التذكيرات</span>
                    </button>
                    <button class="sidebar-unit-toggle" id="sidebar-unit-btn" title="تبديل وحدة القياس (كجم / باوند)">
                        <span id="sidebar-unit-label">كجم</span>
                    </button>
                </div>

                <button class="sidebar-reminder-btn pwa-install-btn" id="sidebar-pwa-install-btn" title="تثبيت التطبيق على جهازك للعمل أوفلاين" style="display: none; width: 100%; margin-bottom: 0.75rem; border-color: var(--accent-blue); color: var(--accent-blue);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    <span>تثبيت التطبيق 📲</span>
                </button>

                <!-- Google Identity Sign-In Integration Wrapper -->
                <div id="google-signin-section" style="margin-bottom: 0.75rem;">
                    <div id="g_id_onload"
                         data-client_id="452956702998-ivve5qvsvi174l08a3bbfep4cmkqn6o3.apps.googleusercontent.com"
                         data-context="signin"
                         data-ux_mode="popup"
                         data-callback="handleCredentialResponse"
                         data-auto_prompt="false">
                    </div>
                    <div id="google-signin-btn-wrap" style="display: flex; justify-content: center; width: 100%;">
                        <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="signin_with" data-size="medium" data-width="215"></div>
                    </div>
                </div>

                <div class="sidebar-profile" id="user-profile">
                    <div class="profile-avatar" id="sidebar-user-avatar">GM</div>
                    <div class="profile-info" style="flex-grow: 1;">
                        <div class="profile-name" id="sidebar-user-name">اسم المستخدم</div>
                        <div class="profile-role" id="sidebar-user-role">الهدف البدني</div>
                    </div>
                    <button class="btn-icon" id="btn-logout" title="تسجيل الخروج" style="display: none; padding: 0.35rem;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main View Target Shell -->
        <main id="view-target">
            <!-- Dynamic pages will be rendered here -->
        </main>
    </div>

    <!-- Mobile Bottom Navigation Bar (Visible only on Mobile) -->
    <nav class="mobile-bottom-nav" id="mobile-bottom-bar">
        <a href="#" class="bottom-nav-item active" id="bnav-dashboard">
            <div class="nav-icon-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>
            </div>
            <span>الرئيسية</span>
        </a>
        <a href="#" class="bottom-nav-item" id="bnav-nutrition">
            <div class="nav-icon-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2v3M12 5a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM8 9a1 1 0 1 1 2 0v2a1 1 0 1 1-2 0V9zM14 9a1 1 0 1 1 2 0v2a1 1 0 1 1-2 0V9z"></path></svg>
            </div>
            <span>السعرات</span>
        </a>
        <a href="#" class="bottom-nav-item" id="bnav-workout">
            <div class="nav-icon-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6.5 6.5h11M6.5 17.5h11M18 5v14M6 5v14M3 8v8M21 8v8M12 5v14"></path></svg>
            </div>
            <span>التمارين</span>
        </a>
        <a href="#" class="bottom-nav-item" id="bnav-evolution">
            <div class="nav-icon-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
            </div>
            <span>التطور</span>
        </a>
        <a href="#" class="bottom-nav-item" id="bnav-assistant">
            <div class="nav-icon-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            </div>
            <span>المساعد</span>
        </a>
    </nav>

    <!-- Application Script Files (Sequential Global Order for Offline/CORS-free execution) -->
    <script src="js/domain/models.js"></script>
    <script src="js/domain/units.js"></script>
    <script src="js/domain/bmr.js"></script>
    <script src="js/domain/foodDb.js"></script>
    <script src="js/domain/exerciseDb.js"></script>
    <script src="js/domain/aiAssistant.js"></script>
    <script src="js/domain/exporter.js"></script>
    <script src="js/domain/reminderManager.js"></script>
    <script src="js/data/dbSchema.js"></script>

    <script src="js/ui/confirmModal.js"></script>
    <script src="js/ui/remindersModal.js"></script>
    <script src="js/ui/dashboard.js"></script>
    <script src="js/ui/nutrition.js"></script>
